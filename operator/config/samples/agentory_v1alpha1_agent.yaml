# Sample agents, one per runtime. All use the in-cluster mock model so they
# work without an API key (deploy/local, `make up`).
#
# The container and harness agents run today; the declarative agent is
# validated and reports Ready=False/BackendNotImplemented until item 8.

# Type 3: declarative agent for non-developers (instructions + skills + MCP tools).
apiVersion: agentory.dev/v1alpha1
kind: Agent
metadata:
  name: payments-oncall
  labels:
    app.kubernetes.io/name: agentory-operator
spec:
  description: On-call triage for payments services
  runtime: declarative
  lifecycle: service
  declarative:
    instructions: |
      You are the on-call agent for the payments team. Triage the alert, check
      recent deploys and logs, and propose a next step. Never act without approval.
  model:
    provider: mock
    name: mock-model
  tools:
    mcpServers:
      - name: datadog
        tools: [query_logs, get_monitor]
  a2a:
    allowedCallers: ["team-sre/*"]
---
# Type 2: your own (multi-)agent container. Runs today (DeploymentBackend):
# the operator creates a Deployment, Service, ServiceAccount and a locked-down
# NetworkPolicy, and injects the gateway environment (AGENTORY_*, OPENAI_BASE_URL, ...).
# nginx is a stand-in that serves on 8080; use your own A2A server image.
apiVersion: agentory.dev/v1alpha1
kind: Agent
metadata:
  name: research-crew
  labels:
    app.kubernetes.io/name: agentory-operator
spec:
  runtime: container
  lifecycle: service
  container:
    image: nginxinc/nginx-unprivileged:1.31.7
    port: 8080
    protocol: a2a
    env:
      - name: LOG_LEVEL
        value: info
  model:
    provider: mock
    name: mock-model
---
# Type 1: coding harness. Runs today (JobBackend): each Task gets its own Job
# running Claude Code headless, with this agent's virtual key and no ingress.
# (harness.workspace, cloning a repo per Task, is backlog item 7a.)
apiVersion: agentory.dev/v1alpha1
kind: Agent
metadata:
  name: payments-coder
  labels:
    app.kubernetes.io/name: agentory-operator
spec:
  runtime: harness
  lifecycle: perTask
  harness:
    kind: claude-code
  model:
    provider: mock
    name: mock-model
