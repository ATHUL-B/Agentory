---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: agents.agentory.dev
spec:
  group: agentory.dev
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    shortNames:
    - ag
    - agents
    singular: agent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.runtime
      name: Runtime
      type: string
    - jsonPath: .spec.lifecycle
      name: Lifecycle
      type: string
    - jsonPath: .spec.model.name
      name: Model
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Agent is the Schema for the agents API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentSpec defines the desired state of an Agent.
            properties:
              a2a:
                description: A2A controls whether and to whom the agent is exposed
                  over A2A.
                properties:
                  allowedCallers:
                    description: AllowedCallers are "namespace/agent" patterns ("*"
                      wildcards allowed) permitted to call this agent.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  expose:
                    default: true
                    description: Expose registers an A2A route and Agent Card on the
                      agent gateway.
                    type: boolean
                type: object
              container:
                description: Container configures a user-supplied image. Required
                  when runtime is "container".
                properties:
                  env:
                    description: |-
                      Env adds environment variables. Names the platform injects (AGENTORY_*, OTEL_*,
                      and the OpenAI/Anthropic SDK base URL and key variables) are reserved.
                    items:
                      description: EnvVar represents an environment variable present
                        in a Container.
                      properties:
                        name:
                          description: |-
                            Name of the environment variable.
                            May consist of any printable ASCII characters except '='.
                          type: string
                        value:
                          description: |-
                            Variable references $(VAR_NAME) are expanded
                            using the previously defined environment variables in the container and
                            any service environment variables. If a variable cannot be resolved,
                            the reference in the input string will be unchanged. Double $$ are reduced
                            to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                            "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                            Escaped references will never be expanded, regardless of whether the variable
                            exists or not.
                            Defaults to "".
                          type: string
                        valueFrom:
                          description: Source for the environment variable's value.
                            Cannot be used if value is not empty.
                          properties:
                            configMapKeyRef:
                              description: Selects a key of a ConfigMap.
                              properties:
                                key:
                                  description: |-
                                    The key to select from the ConfigMap's Data field.
                                    Keys in the BinaryData field are not currently propagated to container env vars.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the ConfigMap or its
                                    key must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                            fieldRef:
                              description: |-
                                Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                                spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                              properties:
                                apiVersion:
                                  description: Version of the schema the FieldPath
                                    is written in terms of, defaults to "v1".
                                  type: string
                                fieldPath:
                                  description: Path of the field to select in the
                                    specified API version.
                                  type: string
                              required:
                              - fieldPath
                              type: object
                              x-kubernetes-map-type: atomic
                            fileKeyRef:
                              description: |-
                                FileKeyRef selects a key of the env file.
                                Requires the EnvFiles feature gate to be enabled.
                              properties:
                                key:
                                  description: |-
                                    The key within the env file. An invalid key will prevent the pod from starting.
                                    The keys defined within a source may consist of any printable ASCII characters except '='.
                                    During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                                  type: string
                                optional:
                                  default: false
                                  description: |-
                                    Specify whether the file or its key must be defined. If the file or key
                                    does not exist, then the env var is not published.
                                    If optional is set to true and the specified key does not exist,
                                    the environment variable will not be set in the Pod's containers.

                                    If optional is set to false and the specified key does not exist,
                                    an error will be returned during Pod creation.
                                  type: boolean
                                path:
                                  description: |-
                                    The path within the volume from which to select the file.
                                    Must be relative and may not contain the '..' path or start with '..'.
                                  type: string
                                volumeName:
                                  description: The name of the volume mount containing
                                    the env file.
                                  type: string
                              required:
                              - key
                              - path
                              - volumeName
                              type: object
                              x-kubernetes-map-type: atomic
                            resourceFieldRef:
                              description: |-
                                Selects a resource of the container: only resources limits and requests
                                (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                              properties:
                                containerName:
                                  description: 'Container name: required for volumes,
                                    optional for env vars'
                                  type: string
                                divisor:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  description: Specifies the output format of the
                                    exposed resources, defaults to "1"
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                resource:
                                  description: 'Required: resource to select'
                                  type: string
                              required:
                              - resource
                              type: object
                              x-kubernetes-map-type: atomic
                            secretKeyRef:
                              description: Selects a key of a secret in the pod's
                                namespace
                              properties:
                                key:
                                  description: The key of the secret to select from.  Must
                                    be a valid secret key.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the Secret or its key
                                    must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                          type: object
                      required:
                      - name
                      type: object
                    maxItems: 64
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                    x-kubernetes-validations:
                    - message: env names AGENTORY_*, OTEL_*, OPENAI_BASE_URL, OPENAI_API_KEY,
                        ANTHROPIC_BASE_URL and ANTHROPIC_API_KEY are reserved for
                        the platform
                      rule: self.all(e, !e.name.startsWith('AGENTORY_') && !e.name.startsWith('OTEL_')
                        && !(e.name in ['OPENAI_BASE_URL', 'OPENAI_API_KEY', 'ANTHROPIC_BASE_URL',
                        'ANTHROPIC_API_KEY']))
                  image:
                    minLength: 1
                    type: string
                  port:
                    default: 8080
                    description: Port the container serves on.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  protocol:
                    default: a2a
                    description: Protocol is "a2a" (routed directly) or "http" (wrapped
                      by an A2A adapter, backlog item 26).
                    enum:
                    - a2a
                    - http
                    type: string
                required:
                - image
                type: object
              declarative:
                description: Declarative configures Agentory's own runtime. Required
                  when runtime is "declarative".
                properties:
                  instructions:
                    description: Instructions is the system prompt.
                    maxLength: 65536
                    minLength: 1
                    type: string
                  skills:
                    description: Skills are loaded from immutable sources.
                    items:
                      description: SkillRef points at one skill (a SKILL.md bundle)
                        at an immutable version.
                      properties:
                        name:
                          description: Name identifies the skill within the agent.
                          maxLength: 63
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        source:
                          description: Source is where the skill is fetched from.
                          properties:
                            configMap:
                              description: |-
                                ConfigMap in the Agent's namespace holding the bundle: a SKILL.md key plus
                                any other files. Mounted read-only; prefer an immutable ConfigMap and a new
                                name per version.
                              properties:
                                name:
                                  maxLength: 253
                                  pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                                  type: string
                              required:
                              - name
                              type: object
                            git:
                              description: GitArtifact is content at a full commit
                                SHA, so it cannot change underneath the agent.
                              properties:
                                commit:
                                  description: Commit is a full 40-character commit
                                    SHA (branches and tags are mutable).
                                  pattern: ^[0-9a-f]{40}$
                                  type: string
                                path:
                                  description: Path inside the repository.
                                  type: string
                                url:
                                  pattern: ^(https|ssh)://.+
                                  type: string
                              required:
                              - commit
                              - url
                              type: object
                            oci:
                              description: OCIArtifact is an OCI artifact pinned by
                                digest.
                              properties:
                                ref:
                                  description: Ref must include a sha256 digest, e.g.
                                    registry/skills/triage@sha256:...
                                  pattern: ^.+@sha256:[0-9a-f]{64}$
                                  type: string
                              required:
                              - ref
                              type: object
                          type: object
                          x-kubernetes-validations:
                          - message: exactly one of git, oci or configMap must be
                              set
                            rule: '[has(self.git), has(self.oci), has(self.configMap)].filter(x,
                              x).size() == 1'
                      required:
                      - name
                      - source
                      type: object
                    maxItems: 64
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                required:
                - instructions
                type: object
              description:
                description: Description is a human-readable summary, published in
                  the A2A Agent Card.
                maxLength: 1024
                type: string
              harness:
                description: Harness configures a coding harness. Required when runtime
                  is "harness".
                properties:
                  image:
                    description: Image overrides the default harness image.
                    type: string
                  kind:
                    description: Kind selects the harness.
                    enum:
                    - claude-code
                    - codex
                    type: string
                  workspace:
                    description: Workspace is the repository checked out for each
                      task.
                    properties:
                      git:
                        description: GitWorkspace is a repository and ref to check
                          out.
                        properties:
                          ref:
                            description: Ref is a branch, tag or commit. Defaults
                              to the repository's default branch.
                            type: string
                          url:
                            pattern: ^(https|ssh)://.+
                            type: string
                        required:
                        - url
                        type: object
                    required:
                    - git
                    type: object
                required:
                - kind
                type: object
              lifecycle:
                description: Lifecycle selects how long the workload lives.
                enum:
                - perTask
                - service
                - suspendable
                type: string
              model:
                description: Model is the model the agent calls through the LLM gateway.
                properties:
                  name:
                    description: Name of the model at that provider, e.g. "claude-sonnet-5-5".
                    minLength: 1
                    type: string
                  provider:
                    description: Provider as configured in the LLM gateway, e.g. "anthropic",
                      "openai" or "mock".
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - name
                - provider
                type: object
              observability:
                description: Observability selects the trace sink. Defaults to the
                  cluster default.
                properties:
                  sink:
                    default: default
                    description: TraceSink selects where traces go.
                    enum:
                    - default
                    - langfuse
                    - mlflow
                    - none
                    type: string
                type: object
              resources:
                description: Resources for the agent's workload.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              runtime:
                description: Runtime selects what executes the agent.
                enum:
                - harness
                - container
                - declarative
                type: string
              tools:
                description: Tools lists the MCP servers the agent may use, reached
                  through the agent gateway.
                properties:
                  mcpServers:
                    items:
                      description: MCPServerRef is a platform-registered MCP server
                        (by name) or a user-supplied endpoint (url).
                      properties:
                        name:
                          maxLength: 63
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        tools:
                          description: Tools is an allow-list of tool names. Empty
                            allows all tools of the server.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: set
                        url:
                          description: URL of a user-supplied MCP endpoint. Omit for
                            a platform-registered server.
                          pattern: ^https?://.+
                          type: string
                      required:
                      - name
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                type: object
            required:
            - lifecycle
            - model
            - runtime
            type: object
            x-kubernetes-validations:
            - message: runtime 'declarative' requires spec.declarative and no spec.harness
                or spec.container
              rule: self.runtime != 'declarative' || (has(self.declarative) && !has(self.harness)
                && !has(self.container))
            - message: runtime 'harness' requires spec.harness and no spec.declarative
                or spec.container
              rule: self.runtime != 'harness' || (has(self.harness) && !has(self.declarative)
                && !has(self.container))
            - message: runtime 'container' requires spec.container and no spec.declarative
                or spec.harness
              rule: self.runtime != 'container' || (has(self.container) && !has(self.declarative)
                && !has(self.harness))
            - message: runtime 'harness' requires lifecycle 'perTask'
              rule: self.runtime != 'harness' || self.lifecycle == 'perTask'
            - message: lifecycle 'suspendable' is not supported yet (needs the Agent
                Substrate backend, backlog item 18)
              rule: self.lifecycle != 'suspendable'
          status:
            description: AgentStatus defines the observed state of an Agent.
            properties:
              conditions:
                description: 'Conditions: Accepted, WorkloadReady, GatewayRouteReady,
                  VirtualKeyReady, EgressPolicyApplied, Ready.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoints:
                description: AgentEndpoints are where clients reach the agent.
                properties:
                  a2a:
                    type: string
                  agentCard:
                    type: string
                  internal:
                    description: |-
                      Internal is the in-cluster address of the agent's workload. Its network policy only
                      admits traffic from the agent gateway; other agents should use the A2A endpoint.
                    type: string
                type: object
              observedGeneration:
                description: ObservedGeneration is the generation this status describes.
                format: int64
                type: integer
              phase:
                description: AgentPhase is a coarse summary of the Agent's state.
                enum:
                - Pending
                - Ready
                - Degraded
                - Failed
                type: string
              revision:
                description: Revision is a hash of the spec; Tasks record the revision
                  they ran against.
                type: string
              virtualKeyRef:
                description: VirtualKeyRef names the Secret holding the agent's LLM
                  gateway virtual key.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
