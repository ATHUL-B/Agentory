---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: tasks.agentory.dev
spec:
  group: agentory.dev
  names:
    kind: Task
    listKind: TaskList
    plural: tasks
    shortNames:
    - tk
    singular: task
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.agentRef.name
      name: Agent
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.traceId
      name: Trace
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Task is the Schema for the tasks API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TaskSpec defines a durable, auditable unit of work (HLD-0001 §3.2).
              The spec is immutable: a Task records what was asked; ask again with a new Task.
            properties:
              agentRef:
                description: AgentRef names an Agent in the same namespace.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              input:
                description: Input is what the agent is asked to do.
                properties:
                  data:
                    description: Data is optional structured context (any JSON object).
                    x-kubernetes-preserve-unknown-fields: true
                  message:
                    description: Message is the natural-language instruction.
                    maxLength: 65536
                    minLength: 1
                    type: string
                required:
                - message
                type: object
              timeout:
                default: 30m
                description: Timeout bounds the task's run time.
                type: string
            required:
            - agentRef
            - input
            type: object
            x-kubernetes-validations:
            - message: Task spec is immutable; create a new Task instead
              rule: self == oldSelf
          status:
            description: TaskStatus defines the observed state of a Task.
            properties:
              agentRevision:
                description: AgentRevision is the Agent revision this task ran (or
                  will run) against.
                type: string
              completedAt:
                format: date-time
                type: string
              conditions:
                description: 'Conditions: AgentResolved, Started.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: TaskPhase summarises where a Task is in its lifecycle.
                enum:
                - Pending
                - Running
                - AwaitingInput
                - Succeeded
                - Failed
                - Cancelled
                type: string
              result:
                description: TaskResult is the outcome of a finished task.
                properties:
                  artifacts:
                    items:
                      description: TaskArtifact is something the task produced, e.g.
                        a git branch.
                      properties:
                        ref:
                          type: string
                        type:
                          type: string
                      required:
                      - ref
                      - type
                      type: object
                    type: array
                  summary:
                    type: string
                type: object
              startedAt:
                format: date-time
                type: string
              traceId:
                description: TraceID links the task to its trace in the trace sink.
                type: string
              usage:
                description: TaskUsage is model usage attributed to the task.
                properties:
                  costUsd:
                    description: CostUSD is a decimal string (e.g. "0.31"); floats
                      are avoided in Kubernetes APIs.
                    pattern: ^[0-9]+(\.[0-9]+)?$
                    type: string
                  inputTokens:
                    format: int64
                    type: integer
                  outputTokens:
                    format: int64
                    type: integer
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
