# Shared agent gateway. Agent A2A routes and MCP backends attach here
# (backlog items 4 and 6).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentory-gateway
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: All
