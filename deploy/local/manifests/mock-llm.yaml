# Deterministic OpenAI-compatible mock LLM (tools/mock-llm), registered in
# Bifrost as provider "mock" so the data plane works without a real API key.
# The code is mounted from the mock-llm-code ConfigMap created by scripts/up.sh.
# Image tag is substituted from versions.env (MOCK_LLM_IMAGE).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm
  namespace: mock-llm
  labels: { app.kubernetes.io/name: mock-llm }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mock-llm }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mock-llm }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: mock-llm
          image: ${MOCK_LLM_IMAGE}
          command: ["python", "-u", "/app/mock_llm.py"]
          env:
            - { name: PORT, value: "8080" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: code, mountPath: /app, readOnly: true }
      volumes:
        - name: code
          configMap:
            name: mock-llm-code
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm
  namespace: mock-llm
spec:
  selector: { app.kubernetes.io/name: mock-llm }
  ports:
    - { name: http, port: 8080, targetPort: http }
