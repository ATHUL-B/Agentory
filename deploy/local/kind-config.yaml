# Single-node kind cluster for local development.
# The default CNI (kindnet) is disabled so Calico can enforce egress
# NetworkPolicies; the pod subnet matches the Calico IP pool in values/calico.yaml.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
