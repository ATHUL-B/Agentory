# Bifrost (LLM gateway) values for local development.
# Provider keys and the dev virtual key are NOT here: scripts/up.sh writes them to
# deploy/local/.secrets/ (git-ignored) and passes that file as a second -f.
fullnameOverride: bifrost

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Provider API keys arrive as env vars from this Secret (created by up.sh).
envFrom:
  - secretRef:
      name: bifrost-provider-keys
      optional: true

storage:
  mode: sqlite
  persistence:
    enabled: true
    size: 1Gi

bifrost:
  logLevel: info
  # Keep the default "split" source of truth. "config.json" mode deletes, on
  # every start-up, all database rows for sections present in the file, which
  # would wipe the per-agent virtual keys the operator creates through the API.
  encryptionKeySecret:
    name: bifrost-encryption
    key: encryption-key
  # Admin credentials lock the management API (/api, dashboard), which the
  # operator uses to manage per-agent virtual keys. Inference stays open to
  # virtual keys only (disableAuthOnInference), enforced by enforceAuthOnInference.
  authConfig:
    isEnabled: true
    disableAuthOnInference: true
    existingSecret: bifrost-admin
    usernameKey: username
    passwordKey: password
  client:
    # Every inference call must carry a virtual key (x-bf-vk) or API key.
    enforceAuthOnInference: true
  plugins:
    otel:
      enabled: true
      config:
        service_name: bifrost
        collector_url: otel-collector.observability.svc.cluster.local:4317
        protocol: grpc
        trace_type: genai_extension
        insecure: true
